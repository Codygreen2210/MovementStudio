# Joins split video parts (each under GitHub's 100 MB file limit) and publishes the
# full file as a GitHub Release asset, so it can be downloaded or scheduled by URL.
# Trigger: push a change to antikythera/release/manifest.json:
#   {"tag": "antikythera-v1", "name": "file.mp4", "parts": ["antikythera/release/file.mp4.part00", ...], "title": "...", "notes": "..."}
name: publish-release
on:
  push:
    paths: ['antikythera/release/manifest.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          M=antikythera/release/manifest.json
          TAG=$(jq -r .tag $M); NAME=$(jq -r .name $M); TITLE=$(jq -r '.title // .tag' $M); NOTES=$(jq -r '.notes // ""' $M)
          : > "$NAME"; for p in $(jq -r '.parts[]' $M); do cat "$p" >> "$NAME"; done
          ls -la "$NAME"; sha256sum "$NAME"
          gh release delete "$TAG" -y --cleanup-tag || true
          gh release create "$TAG" "$NAME" --title "$TITLE" --notes "$NOTES"
          for f in $(jq -r '.extra[]? // empty' $M); do gh release upload "$TAG" "$f" --clobber; done
          echo "published https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$NAME" > antikythera/release/status.txt
          git config user.name "publish-release"; git config user.email "publish-release@users.noreply.github.com"
          git add antikythera/release/status.txt; git commit -m "release $TAG published" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
